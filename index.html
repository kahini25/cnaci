
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps CI/CD Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
    }
    main { padding: 30px; }
    h1 { font-size: 42px; }
    p { color: #b8c4d8; line-height: 1.7; }
    a {
      display: inline-block;
      background: #7c6cff;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>My CI/CD Pipeline 🚀</h1>
    <p>Built with HTML, GitHub Actions, and Vercel.</p>
    <p>Every code push can trigger an automated workflow.</p>
    <a href="https://github.com/" target="_blank">Explore GitHub</a>
  </main>
</body>
</html>
